<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>メルフォト</title>
<meta name="theme-color" content="#F4F2EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="メルフォト">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
/* layout: 片手で操作する1カラム。上に撮影ボタン、真ん中に加工済みの写真、下に固定の「保存」「メルカリを開く」 */
:root{
  --bg:#F4F2EF; --card:#FFFFFF; --ink:#22201E; --muted:#6E6964; --line:#E2DED9;
  --accent:#E8513D; --accent-ink:#FFFFFF; --soft:#FBE7E3; --ok:#2E7D4F;
  --font:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;
}
@media (prefers-color-scheme: dark){:root{--bg:#181716;--card:#242220;--ink:#F2EFEB;--muted:#ABA49D;--line:#3A3734;--soft:#3A2522;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-text-size-adjust:100%;
  padding-top:env(safe-area-inset-top,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
header{display:flex;align-items:baseline;justify-content:space-between;padding-block:14px 8px}
h1{font-size:22px;margin:0;letter-spacing:.04em}
.count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.shoot{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-block:6px 12px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;text-decoration:none;cursor:pointer;width:100%}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.camera{grid-column:1 / -1;min-height:64px;font-size:17px}
.btn[disabled]{opacity:.45}
.btn svg{width:22px;height:22px;flex:none}
input[type=file]{display:none}
.opts{display:grid;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px}
.opt>span{font-size:13px;color:var(--muted);white-space:nowrap}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--muted);padding:8px 10px;min-height:36px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--line);aspect-ratio:1/1}
.tile img{width:100%;height:100%;object-fit:cover;display:block;-webkit-touch-callout:default}
.tile .no{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;border-radius:6px;padding:2px 7px}
.tile .tag{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:2px 6px}
.tile .del{position:absolute;right:6px;top:6px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:30px;cursor:pointer}
.tile.busy::after{content:"加工中…";position:absolute;inset:0;display:grid;place-items:center;background:rgba(255,255,255,.75);color:#22201E;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:36px 12px;border:2px dashed var(--line);border-radius:14px;line-height:1.7}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6;margin-top:12px}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:grid;gap:8px;
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:grid;grid-template-columns:1fr auto;gap:8px}
.ghost{background:transparent;border:0;color:var(--muted);font:inherit;font-size:13px;text-decoration:underline;padding:0 6px;cursor:pointer}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;max-width:calc(100% - 32px);text-align:center;z-index:9}
[hidden]{display:none!important}
</style>
</head>
<body>
<header><h1>メルフォト</h1><span class="count" id="count">0 / 20枚</span></header>

<div class="shoot">
  <label class="btn primary camera" for="cam"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>写真を撮る</label>
  <input id="cam" type="file" accept="image/*" capture="environment">
  <label class="btn" for="album"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16l5-5 4 4 3-3 6 6"/></svg>アルバムから</label>
  <input id="album" type="file" accept="image/*" multiple>
  <button class="btn" id="clear" type="button">全部消す</button>
</div>

<div class="opts">
  <div class="opt"><span>形</span><div class="seg" role="group" aria-label="形">
    <button type="button" data-shape="crop" aria-pressed="true">正方形に切り抜く</button>
    <button type="button" data-shape="fit" aria-pressed="false">白い余白で全体</button></div></div>
  <div class="opt"><span>明るさ・色</span><div class="seg" role="group" aria-label="明るさ・色">
    <button type="button" data-tone="auto" aria-pressed="true">おまかせ</button>
    <button type="button" data-tone="strong" aria-pressed="false">強め</button>
    <button type="button" data-tone="none" aria-pressed="false">補正なし</button></div></div>
</div>

<div class="grid" id="grid"></div>
<p class="empty" id="empty">「写真を撮る」で撮影すると、<br>メルカリ用（正方形・明るく）に自動で加工されます。<br>1枚目が表紙になります。</p>
<p class="hint">写真はこのiPhoneの中だけで加工します。どこにも送信しません。<br>保存がうまくいかないときは、写真を長押しして「"写真"に追加」でも保存できます。</p>

<div class="bar">
  <button class="btn primary" id="save" type="button" disabled>写真を保存（0枚）</button>
  <div class="row">
    <a class="btn" id="open" href="https://jp.mercari.com/sell/create" target="_blank" rel="noopener">メルカリを開く</a>
  </div>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
